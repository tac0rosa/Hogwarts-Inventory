{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hogwarts Inventory{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventory/css/style.css' %}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}">Hogwarts Inventory</a>
        <nav class="nav-links">
            <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} class="active"{% endif %}>Home</a>
            <a href="{% url 'house_list' %}"{% if 'house' in request.resolver_match.url_name %} class="active"{% endif %}>Houses</a>
            <a href="{% url 'professor_list' %}"{% if 'professor' in request.resolver_match.url_name %} class="active"{% endif %}>Professors</a>
            <a href="{% url 'student_list' %}"{% if 'student' in request.resolver_match.url_name %} class="active"{% endif %}>Students</a>
            <a href="{% url 'item_list' %}"{% if 'item' in request.resolver_match.url_name %} class="active"{% endif %}>Items</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
