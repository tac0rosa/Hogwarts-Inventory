{% extends 'inventory/base.html' %}

{% block title %}Delete {{ item.name }} | Hogwarts Inventory{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete {{ item.name }}?</h1>
    <p class="warning">This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Delete</button>
            <a href="{% url 'item_detail' item.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
