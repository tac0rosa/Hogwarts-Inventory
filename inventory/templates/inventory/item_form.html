{% extends 'inventory/base.html' %}

{% block title %}{% if item %}Edit {{ item.name }}{% else %}Add Item{% endif %} | Hogwarts Inventory{% endblock %}

{% block content %}
<div class="card">
    <h1>{% if item %}Edit {{ item.name }}{% else %}Add Item{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a class="back-link" href="{% url 'item_list' %}">&larr; Back to items</a>
</div>
{% endblock %}
