{% extends 'inventory/base.html' %}

{% block title %}Delete {{ professor.name }} | Hogwarts Inventory{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete {{ professor.name }}?</h1>
    <p class="warning">Any students advised by {{ professor.name }} will lose their advisor. This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Delete</button>
            <a href="{% url 'professor_detail' professor.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
