{% extends 'inventory/base.html' %}

{% block title %}Delete {{ student.name }} | Hogwarts Inventory{% endblock %}

{% block content %}
<div class="card">
    <h1>Delete {{ student.name }}?</h1>
    <p class="warning">Any items owned by {{ student.name }} will lose their owner. This can't be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Delete</button>
            <a href="{% url 'student_detail' student.pk %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
