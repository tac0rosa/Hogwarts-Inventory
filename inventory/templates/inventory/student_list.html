<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students | Hogwarts Inventory</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1b1b3a, #4b2e83);
            color: #f7f3ff;
            margin: 0;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .card {
            background: rgba(255,255,255,0.12);
            padding: 2rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 700px;
            margin: 0 auto;
        }
        h1 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.2); }
        a { color: #f7f3ff; }
        .back-link { display: inline-block; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Students</h1>
        {% if students %}
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Year</th>
                        <th>House</th>
                        <th>Advisor</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                        <tr>
                            <td><a href="{% url 'student_detail' student.pk %}">{{ student.name }}</a></td>
                            <td>{{ student.year }}</td>
                            <td>{{ student.house.name }}</td>
                            <td>{{ student.advisor.name|default:"—" }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No students yet.</p>
        {% endif %}
        <a class="back-link" href="{% url 'student_create' %}">+ Add student</a><br>
        <a class="back-link" href="{% url 'home' %}">&larr; Back to home</a>
    </div>
</body>
</html>
